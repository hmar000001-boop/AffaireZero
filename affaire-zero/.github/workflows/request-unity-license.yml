name: Request Unity Personal license file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation-file:
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file for this Unity version
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file for manual license activation
        uses: actions/upload-artifact@v4
        with:
          name: Unity-activation-file
          path: ${{ steps.activation.outputs.filePath }}
          retention-days: 1
