name: Affaire Zero · Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affaire-zero-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Unity import artifacts
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-6000.3.27f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-6000.3.27f1-

      - name: Build Affaire Zero for Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.27f1
          targetPlatform: Android
          buildMethod: AffaireZero.Editor.AndroidBuild.BuildAndroid
          buildsPath: BuildOutput
          allowDirtyBuild: true

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AffaireZero-Android-${{ github.run_number }}
          path: |
            BuildOutput/Android/AffaireZero.apk
            BuildOutput/**/*.txt
          if-no-files-found: warn
          retention-days: 14
