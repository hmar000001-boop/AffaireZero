name: Affaire Zero - Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          mkdir -p build

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/AffaireZero.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffaireZero-Android-APK
          path: build/AffaireZero.apk
          if-no-files-found: error
          retention-days: 14
